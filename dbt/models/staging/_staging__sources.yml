version: 2

sources:
  - name: raw
    description: >
      Landed football-data.org API responses, loaded by the Python ingestion
      layer. Each row is a natural key plus the untouched JSON payload, and the
      table's primary key enforces idempotency (upsert, never append). All the
      field-level interpretation happens in the staging models below.
    database: football          # DuckDB names the catalog after the file stem
    schema: raw

    tables:
      # Freshness is measured on the run log, not on the data tables: _loaded_at
      # only moves when a payload changes, and during an international break
      # nothing changes for two weeks even though ingestion is healthy.
      - name: _load_runs
        description: "One row per ingestion run: status, row counts, failures."
        loaded_at_field: finished_at
        freshness:
          warn_after: {count: 26, period: hour}
          error_after: {count: 72, period: hour}
          filter: "status = 'success'"
      - name: teams
        description: "One row per team, keyed by team_id."
        columns:
          - name: team_id
            description: "football-data.org global team id (natural key)."
          - name: payload
            description: "Full team object as returned by /competitions/{id}/teams."
      - name: matches
        description: >
          One row per match across all league competitions, keyed by match_id.
          Scores are null until a match is played.
        columns:
          - name: match_id
            description: "football-data.org global match id (natural key)."
          - name: payload
            description: "Full match object, incl. stage, status, score, teams."
      - name: standings
        description: >
          One row per team per matchday snapshot per table type
          (TOTAL/HOME/AWAY), keyed by
          (competition_code, season_id, team_id, matchday, standing_type).
          All table types are preserved; the TOTAL selection is a downstream
          decision.
        columns:
          - name: standing_type
            description: "API table type: TOTAL, HOME, or AWAY."
          - name: payload
            description: "One standings table row (position, points, goals, ...)."
