version: 2

# Staging-scoped tests: key uniqueness/not-null and accepted_values on the
# enum-like columns. stage lists only values seen in the data, so a new one
# fails the build and adding it is a deliberate edit.

models:
  - name: stg_teams
    description: "Thin typed view of raw.teams (1:1). One row per team."
    columns:
      - name: team_id
        description: "Team natural key."
        data_tests:
          - unique
          - not_null
      - name: team_name
        description: "Full club name."
        data_tests:
          - not_null
      - name: competition_code
        description: "A competition this team was pulled under (PL, PD, ...)."
        data_tests:
          - not_null

  - name: stg_matches
    description: >
      Thin typed view of raw.matches (1:1). One row per match across all
      competitions and seasons. Scores nullable until played.
    columns:
      - name: match_id
        description: "Match natural key."
        data_tests:
          - unique
          - not_null
      - name: competition_code
        data_tests:
          - not_null
      - name: season_id
        description: "Season id (unique per competition)."
        data_tests:
          - not_null
      - name: status
        description: >
          Match lifecycle status, normalised: a kickoff timestamp that the free
          tier sometimes returns in this field is mapped to SCHEDULED. Any other
          unexpected value fails the build, so a new status gets noticed.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['SCHEDULED', 'TIMED', 'IN_PLAY', 'PAUSED', 'FINISHED',
                         'SUSPENDED', 'POSTPONED', 'CANCELLED', 'AWARDED']
      - name: status_raw
        description: "status exactly as the API returned it, kept for auditing."
      - name: kickoff_date
        description: "UTC date of kickoff."
        data_tests: [not_null]
      - name: stage
        description: "Competition stage. REGULAR_SEASON for every league match."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['REGULAR_SEASON']
      - name: winner
        description: "Full-time winner: HOME_TEAM / AWAY_TEAM / DRAW; null if unplayed."
        data_tests:
          - accepted_values:
              arguments:
                values: ['HOME_TEAM', 'AWAY_TEAM', 'DRAW']
      - name: duration
        description: "How the result was decided."
        data_tests:
          - accepted_values:
              arguments:
                values: ['REGULAR', 'EXTRA_TIME', 'PENALTY_SHOOTOUT']

  - name: stg_standings
    description: >
      Thin typed view of raw.standings (1:1). Keeps all table types and exposes
      is_total_standing. fact_standings doesn't read it (standings are derived
      from results); assert_standings_reconcile_with_endpoint compares the two.
    columns:
      - name: competition_code
        data_tests: [not_null]
      - name: season_id
        data_tests: [not_null]
      - name: team_id
        description: "Team natural key."
        data_tests: [not_null]
      - name: matchday
        data_tests: [not_null]
      - name: standing_type
        description: "API table type."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['TOTAL', 'HOME', 'AWAY']
      - name: is_total_standing
        description: "True for the TOTAL table."
        data_tests: [not_null]
