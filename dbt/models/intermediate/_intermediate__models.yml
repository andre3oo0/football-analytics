version: 2

models:
  - name: int_seasons
    description: >
      One row per competition-season, deduped from the season object that
      repeats across stg_matches. Adds a readable season_label. Feeds dim_seasons.
    columns:
      - name: season_id
        description: "Season natural key (unique per competition)."
        data_tests: [not_null]
      - name: competition_code
        data_tests: [not_null]

  - name: int_matches
    description: >
      Match-level derivations on top of stg_matches: null-safe measures (total
      goals, points per side) and a has_result flag. Feeds fact_matches.
    columns:
      - name: match_id
        data_tests: [unique, not_null]
