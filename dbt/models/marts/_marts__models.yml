version: 2

# Phase 4 mart tests cover primary-key uniqueness/not-null and the fact grain.
# Relationships (FK) tests and the custom singular tests are added in Phase 5.

models:
  # ------------------------------- dimensions ----------------------------- #
  - name: dim_competitions
    description: "One row per competition. competition_type = LEAGUE | TOURNAMENT."
    columns:
      - name: competition_code
        description: "PK."
        data_tests: [unique, not_null]
      - name: competition_type
        data_tests:
          - accepted_values:
              values: ['LEAGUE', 'TOURNAMENT']

  - name: dim_teams
    description: "One row per team."
    columns:
      - name: team_id
        description: "PK."
        data_tests: [unique, not_null]
      - name: team_name
        data_tests: [not_null]

  - name: dim_seasons
    description: "One row per competition-season."
    columns:
      - name: season_id
        description: "PK (unique per competition)."
        data_tests: [unique, not_null]
      - name: competition_code
        description: "FK to dim_competitions."
        data_tests: [not_null]

  # --------------------------------- facts -------------------------------- #
  - name: fact_matches
    description: >
      One row per match across ALL competitions. stage distinguishes league vs
      World Cup rounds. Scores/measures nullable until played.
    columns:
      - name: match_id
        description: "Grain / degenerate key."
        data_tests: [unique, not_null]
      - name: competition_code
        data_tests: [not_null]
      - name: season_id
        data_tests: [not_null]
      - name: home_team_id
        data_tests: [not_null]
      - name: away_team_id
        data_tests: [not_null]

  - name: fact_standings
    description: >
      One row per team per matchday snapshot (incremental, delete+insert on
      standing_key). Re-fetched matchdays update in place; new matchdays append.
    columns:
      - name: standing_key
        description: "Surrogate grain key: competition|season|team|matchday."
        data_tests: [unique, not_null]
      - name: competition_code
        data_tests: [not_null]
      - name: season_id
        data_tests: [not_null]
      - name: team_id
        data_tests: [not_null]
      - name: matchday
        data_tests: [not_null]
