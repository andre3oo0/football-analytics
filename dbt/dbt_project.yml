name: 'football_analytics'
version: '1.0.0'
config-version: 2

# This profile is defined in the profiles.yml shipped alongside this project.
# Run dbt from the dbt/ directory with: --profiles-dir .
profile: 'football_analytics'

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# Layering strategy (do not collapse):
#   staging      -> thin, 1:1 with raw, rename/cast/unpack only -> VIEWS
#   intermediate -> joins, dedup, business logic                -> VIEWS  (Phase 4)
#   marts        -> star schema (dims + facts)                  -> TABLES (Phase 4)
models:
  football_analytics:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts
