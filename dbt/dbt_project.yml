name: 'football_analytics'
version: '1.0.0'
config-version: 2

# Profile lives in the profiles.yml next to this file.
# Run dbt from the dbt/ directory with: --profiles-dir .
profile: 'football_analytics'

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# Layering, kept separate on purpose:
#   staging      thin 1:1 views over raw (rename/cast/unpack only)
#   intermediate views for joins, dedup and business logic
#   marts        the star schema (dims + facts), materialized as tables
models:
  football_analytics:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts
