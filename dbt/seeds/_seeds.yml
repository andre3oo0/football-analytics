version: 2

seeds:
  - name: seed_competitions
    description: >
      The competitions in scope. Hand-maintained. It is the single source of
      truth: ingestion reads it to decide what to pull, and it feeds
      dim_competitions. Adding a league is one row here.
    columns:
      - name: competition_code
        description: "football-data.org competition code (PK)."
        data_tests:
          - unique
          - not_null
      - name: competition_name
        data_tests: [not_null]
