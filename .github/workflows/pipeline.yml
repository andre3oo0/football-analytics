name: football-data-pipeline

# Nightly run of the real pipeline: restore yesterday's warehouse, ingest the
# live season, dbt build (models, unit tests and data tests), export the marts,
# and save the warehouse for tomorrow.
#
# State lives in the Actions cache. Each successful run saves the DuckDB file
# and the raw JSON cache under a new key; the next run restores the newest one.
# A failed run saves nothing, so a bad day never overwrites a good warehouse.
# If there's no cache (first run, or GitHub evicted it after 7 days without a
# run), the bootstrap step backfills the completed seasons from the API first.
#
# Timing: GitHub starts `schedule` runs late under load (4-7 hours here), so the
# nightly run is started at 02:00 SAST by an external cron service calling the
# workflow_dispatch API (see docs/orchestration.md). The schedule below is only
# a fallback: its run exits early if tonight's run has already succeeded.

on:
  schedule:
    # 00:00 UTC = 02:00 SAST (UTC+2, no daylight saving), after the last
    # European evening games have finished.
    - cron: "0 0 * * *"
  workflow_dispatch: {}

# One run at a time; the DuckDB file is single-writer.
concurrency:
  group: football-data-pipeline
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # A scheduled (fallback) run is skipped when a run that started on or after
  # tonight's 00:00 UTC slot has already succeeded. Manual and API-dispatched
  # runs always go ahead.
  decide:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Ten minutes before today's 00:00 UTC, as an ISO timestamp.
          midnight=$(date -u -d "$(date -u +%F)" +%s)
          since=$(date -u -d "@$((midnight - 600))" +%Y-%m-%dT%H:%M:%SZ)
          earlier=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow pipeline.yml \
            --status success --limit 20 --json createdAt,url \
            --jq "map(select(.createdAt >= \"$since\")) | first | .url // empty")
          if [ -n "$earlier" ]; then
            echo "Tonight's run already succeeded: $earlier. Skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "No successful run since $since. Running as the fallback."
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  run-pipeline:
    needs: decide
    if: needs.decide.outputs.run == 'true'
    runs-on: ubuntu-latest
    env:
      FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
      DBT_DUCKDB_PATH: ../data/football.duckdb

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore warehouse from the last successful run
        id: restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            data/football.duckdb
            data/raw/*.json
          key: warehouse-${{ github.run_id }}
          restore-keys: warehouse-

      - name: Bootstrap completed seasons (only when there is no warehouse yet)
        if: hashFiles('data/football.duckdb') == ''
        run: |
          python -m ingestion.run --season 2024
          python -m ingestion.run --season 2025

      - name: Ingest the live season
        run: python -m ingestion.run --refresh

      - name: dbt build (fails the job on any test failure)
        working-directory: dbt
        run: dbt build --profiles-dir .

      - name: dbt docs
        working-directory: dbt
        run: dbt docs generate --profiles-dir .

      - name: Export marts to Parquet
        run: python export_marts.py --out exports

      - name: Last ingestion runs
        run: >
          python -c "import duckdb;
          con = duckdb.connect('data/football.duckdb', read_only=True);
          con.sql('select run_id, finished_at, status, season, rows_changed, rows_deleted
          from raw._load_runs order by finished_at desc limit 5').show()"

      - name: Save warehouse for the next run
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            data/football.duckdb
            data/raw/*.json
          key: warehouse-${{ github.run_id }}

      - name: Upload marts (Parquet)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: marts-parquet
          path: exports/*.parquet
          retention-days: 14

      - name: Upload dbt docs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dbt-docs
          path: |
            dbt/target/index.html
            dbt/target/manifest.json
            dbt/target/catalog.json
            dbt/target/run_results.json
          if-no-files-found: ignore
