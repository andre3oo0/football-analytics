name: football-data-pipeline

# Runs the whole pipeline on a schedule and on demand:
# ingest the live season, then dbt build (run + test), then generate docs.
#
# A note on what a run actually does right now: the leagues are in the 2026/27
# off-season, so a scheduled pull fetches fixtures with no results yet and
# fact_standings (which is derived from finished matches) comes out empty until
# the season starts. That's expected, not a bug, and the same workflow will
# produce real standings once matches are played. The incremental behaviour is
# shown locally against the completed 2024/25 season (see the README), since
# there's no live result data to show it against yet.

on:
  schedule:
    # 06:00 UTC daily. Only pulls the current season (~18 requests) at ~8/min,
    # comfortably under the 10/min free-tier limit.
    - cron: "0 6 * * *"
  workflow_dispatch: {}   # manual "Run workflow" button

# Don't let two scheduled runs overlap; the DuckDB file is single-writer.
concurrency:
  group: football-data-pipeline
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    env:
      # Comes from a GitHub repository secret. Not committed, never echoed, and
      # GitHub masks it in logs. The ingestion code reads it from this env var.
      FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # The steps below run one at a time, each as its own process that opens
      # and closes the DuckDB file before the next starts, so there's never more
      # than one writer.

      - name: Ingest live season (current 2026/27 leagues)
        # Current season only (no --season). I don't re-pull the completed
        # 2024/25 backfill on a schedule; it never changes, so fetching it every
        # night would just waste API budget.
        #
        # On TLS: the client calls truststore.inject_into_ssl(), which uses the
        # runner's OS trust store. ubuntu-latest ships the normal public CAs and
        # has no corporate root, so this is just ordinary public-CA verification.
        # If this step connects and gets 200s, TLS in CI is fine.
        run: python -m ingestion.run --refresh

      - name: dbt build (run models and tests, fail on any failure)
        working-directory: dbt
        # dbt build runs each model then its tests in dependency order and exits
        # non-zero if any test fails, which turns the job red. That's the whole
        # "fail loudly" guarantee.
        run: dbt build --profiles-dir .

      - name: Generate dbt docs (lineage + catalog)
        working-directory: dbt
        run: dbt docs generate --profiles-dir .

      - name: Upload dbt docs as an artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dbt-docs
          path: |
            dbt/target/index.html
            dbt/target/manifest.json
            dbt/target/catalog.json
          if-no-files-found: ignore
